<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent;
    }
    .recorder-container {
      display: flex; align-items: center; gap: 15px;
      background: white; border: 1px solid rgba(0,0,0,0.08);
      padding: 10px 20px; border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      width: 100%; box-sizing: border-box;
    }
    button {
      background: #ffffff; color: #b8860b;
      border: 1px solid rgba(184, 134, 11, 0.4);
      border-radius: 8px; font-family: 'Inter', sans-serif;
      font-weight: 600; padding: 10px 20px;
      cursor: pointer; transition: all 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    button:hover { background: #b8860b; color: white; }
    .recording-btn {
      background: #fee2e2; color: #dc2626; border-color: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .recording-btn:hover { background: #fecaca; color: #b91c1c; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .timer {
      font-size: 1.2rem; font-weight: 700; color: #dc2626;
      font-variant-numeric: tabular-nums;
    }
    audio { height: 40px; outline: none; flex-grow: 1; }
  </style>
</head>
<body>
  <div class="recorder-container">
    <button id="recordBtn">🎙️ Record</button>
    <div id="timer" class="timer" style="display: none;">30s</div>
    <audio id="audioPlayback" controls style="display: none;"></audio>
    <button id="clearBtn" style="display: none; margin-left: auto;">✖ Clear</button>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let timerInterval;
    let timeLeft = 30;

    const recordBtn = document.getElementById('recordBtn');
    const timerDisplay = document.getElementById('timer');
    const audioPlayback = document.getElementById('audioPlayback');
    const clearBtn = document.getElementById('clearBtn');

    function sendHeight() { Streamlit.setFrameHeight(75); }
    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, sendHeight);
    Streamlit.setComponentReady();
    sendHeight();

    recordBtn.onclick = async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          
          let mimeType = 'audio/webm';
          // Use mp4 on Safari
          if (typeof MediaRecorder.isTypeSupported === 'function' && !MediaRecorder.isTypeSupported(mimeType)) {
             mimeType = 'audio/mp4'; 
          }
          
          mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
          audioChunks = [];

          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: mimeType });
            const audioUrl = URL.createObjectURL(audioBlob);
            audioPlayback.src = audioUrl;
            audioPlayback.style.display = 'block';
            clearBtn.style.display = 'flex';
            recordBtn.style.display = 'none';
            timerDisplay.style.display = 'none';
            
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              // result is like "data:audio/webm;base64,GkXfo59ChoEBQveBAaLx..."
              Streamlit.setComponentValue(reader.result);
            };
            stream.getTracks().forEach(track => track.stop());
            sendHeight();
          };

          mediaRecorder.start();
          isRecording = true;
          recordBtn.innerHTML = "⏹ Stop";
          recordBtn.classList.add("recording-btn");
          timerDisplay.style.display = 'block';
          timeLeft = 30;
          timerDisplay.textContent = timeLeft + "s";

          timerInterval = setInterval(() => {
            timeLeft--;
            timerDisplay.textContent = timeLeft + "s";
            if (timeLeft <= 0) stopRecording();
          }, 1000);

        } catch (err) {
          console.error(err);
          alert("Microphone access denied or not supported.");
        }
      } else {
        stopRecording();
      }
    };

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      isRecording = false;
      clearInterval(timerInterval);
      recordBtn.classList.remove("recording-btn");
      recordBtn.innerHTML = "🎙️ Record";
    }

    clearBtn.onclick = () => {
      audioPlayback.style.display = 'none';
      clearBtn.style.display = 'none';
      recordBtn.style.display = 'flex';
      Streamlit.setComponentValue(null);
      sendHeight();
    };
  </script>
</body>
</html>
